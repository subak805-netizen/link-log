<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LINK.LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* 토큰 — FIT.LOG DESIGN_GUIDE 그대로 */
:root{
  --paper:#FFFFFF; --panel:#FBF8F3; --dim:#F2EBE0; --beige:#E3D8C6;
  --ink:#181613; --mut:#8B8377; --olive:#5F6B33; --terra:#C25E3A; --gold:#EBC63C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13px; line-height:1.5; color:var(--ink); background:var(--paper);
  overflow-wrap:anywhere; -webkit-text-size-adjust:100%; overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;border-radius:0}
button{background:none;border:0;cursor:pointer}
a{color:inherit}

.wrap{max-width:760px;margin:0 auto;padding:0 12px 40px}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;margin:0 -12px;padding-left:12px;padding-right:12px}
.logo{display:flex;align-items:baseline;gap:5px}
.logo b{font-family:Doto,monospace;font-weight:900;font-size:20px}
.logo .dot{width:7px;height:7px;background:var(--terra);display:inline-block}
.topbar .r{display:flex;gap:6px;align-items:center}
.acct{font-size:9.5px;letter-spacing:.12em;color:var(--mut);border:1px solid var(--beige);padding:5px 8px;white-space:nowrap;cursor:pointer}
.gear{font-size:10px;font-weight:800;color:var(--mut);border:1px solid var(--beige);padding:5px 8px;cursor:pointer;letter-spacing:.08em}

/* 빠른 입력 */
.quick{display:flex;gap:6px;margin-top:12px}
.quick input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--paper);padding:9px 10px;font-size:12.5px}
.quick input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--gold)}
.quick button{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 13px;font-size:11.5px;font-weight:800;white-space:nowrap}
.qres{font-size:10.5px;margin-top:5px;color:var(--mut)}

/* 검색 */
.search{margin-top:8px}
.search input{width:100%;border:2px solid var(--ink);background:var(--paper);padding:8px 10px;font-size:12.5px}
.search input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--gold)}

.bar{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;padding:4px 8px;border:1px solid var(--beige);background:var(--panel);color:var(--mut);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.hint{font-size:9px;color:var(--mut);letter-spacing:.06em}

/* 트리 */
.tree{border:2px solid var(--ink);margin-top:10px}
.tnode{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--beige);cursor:pointer;font-weight:800;background:var(--paper)}
.tnode:last-child{border-bottom:0}
.tnode .ar{width:9px;font-size:9px;color:var(--mut);flex:none}
.tnode .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tnode .cnt{font-family:Doto,monospace;font-weight:700;font-size:12px;color:var(--mut);flex:none}
.tnode.g1{background:var(--ink);color:var(--paper);border-bottom-color:var(--ink)}
.tnode.g1 .ar,.tnode.g1 .cnt{color:var(--paper);opacity:.7}
.tnode.g2{padding-left:24px;font-size:11.5px}
.tnode.over{box-shadow:inset 0 0 0 3px var(--gold);background:var(--dim)}
.tnode .mk{flex:none;font-size:9.5px;color:var(--mut);border:1px solid var(--beige);padding:2px 6px;cursor:pointer}
.tnode.g1 .mk{color:var(--paper);border-color:rgba(255,255,255,.4)}
.tnode .mk:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tlink{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 38px;border-bottom:1px solid var(--beige);font-size:11.5px;background:var(--paper);cursor:grab}
.tlink:last-child{border-bottom:0}
.tlink:hover{background:var(--panel)}
.tlink.dragging{opacity:.4}
.tlink .fi{width:15px;height:15px;flex:none;object-fit:contain;background:var(--dim)}
.tlink .fi.txt{display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--mut)}
.tlink .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-decoration:none}
.tlink .t:hover{text-decoration:underline}
.tlink .dm{font-size:9px;color:var(--mut);flex:none;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink .ed{flex:none;font-size:10px;color:var(--mut);border:1px solid var(--beige);padding:2px 5px;cursor:pointer}
.tlink.dead .t{opacity:.45;text-decoration:line-through}
.crumb{font-size:9px;color:var(--mut);letter-spacing:.08em;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--beige)}
.empty{border:2px dashed var(--beige);background:var(--panel);padding:24px 14px;text-align:center;color:var(--mut);font-size:11.5px;line-height:1.9;margin-top:10px}

/* 설정·시트 */
.mask{position:fixed;inset:0;background:rgba(24,22,19,.42);z-index:80;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--paper);border-top:2px solid var(--ink);
  max-height:92vh;overflow:auto;display:none;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{display:block}
.shd{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px}
.shd b{font-size:13px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shd .x{font-size:11px;font-weight:800;color:var(--mut);padding:4px 6px;cursor:pointer;letter-spacing:.1em}
.sbd{padding:12px 12px 20px;max-width:560px;margin:0 auto}
.f{margin-bottom:12px}
.f>label{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--mut);margin-bottom:4px}
.f input,.f textarea{width:100%;border:2px solid var(--ink);background:var(--paper);padding:8px 9px;font-size:12.5px}
.f input:focus,.f textarea:focus{outline:0;box-shadow:inset 0 0 0 2px var(--gold)}
.btn{border:2px solid var(--ink);background:var(--paper);padding:9px 12px;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--terra);color:var(--terra)}
.btn.w{width:100%}
.kv{border:1px solid var(--beige);background:var(--panel);padding:9px 10px;margin-bottom:8px;font-size:11.5px;line-height:1.7}
.kv .l{font-size:9px;letter-spacing:.13em;color:var(--mut)}
.note{border:2px solid var(--beige);background:var(--panel);padding:11px;margin-top:10px;font-size:11px;color:var(--mut);line-height:1.9}
.note b{color:var(--ink)}
.seg{display:flex;border:2px solid var(--ink);margin-bottom:10px}
.seg b{flex:1;text-align:center;padding:7px 4px;font-size:11px;font-weight:800;color:var(--mut);border-right:1px solid var(--ink);cursor:pointer}
.seg b:last-child{border-right:0}
.seg b.on{background:var(--ink);color:var(--paper)}
.dropzone{border:2px dashed var(--ink);background:var(--panel);padding:20px 14px;text-align:center;font-size:11.5px;color:var(--mut);line-height:1.9;cursor:pointer}
.dropzone.drag{box-shadow:inset 0 0 0 3px var(--gold);background:var(--dim)}
.pick{display:flex;flex-wrap:wrap;gap:4px}
.pick b{border:1px solid var(--beige);background:var(--panel);color:var(--mut);padding:6px 9px;font-size:11px;font-weight:800;cursor:pointer}
.pick b.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--paper);
  padding:9px 14px;font-size:11.5px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .18s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
@media(max-width:600px){ .tlink .dm{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="logo"><b>LINK</b><i class="dot"></i><b>LOG</b></div>
    <div class="r">
      <span id="ver" style="font-size:8px;letter-spacing:.1em;color:var(--mut)"></span>
      <button class="acct" id="acctBtn">로그인</button>
      <button class="gear" id="setBtn">설정</button>
    </div>
  </header>

  <div class="quick">
    <input id="qi" placeholder="주소 붙여넣기 (여러 개는 쉼표로)" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
    <button id="qiBtn">추가</button>
  </div>
  <div class="qres" id="qres"></div>

  <div class="search"><input id="q" placeholder="검색" autocomplete="off"></div>

  <div class="bar">
    <b class="chip" id="expAll">모두 펴기</b>
    <b class="chip" id="colAll">모두 접기</b>
    <b class="chip" id="newGroup">＋ 대분류</b>
    <span class="hint">링크·폴더는 끌어다 놓아 옮깁니다</span>
  </div>

  <div id="body"></div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="shd"><b id="shT"></b><span class="x" id="shX">닫기</span></div><div class="sbd" id="shB"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept=".json,.html,.htm,.csv" style="display:none">

<script>
const APP_VER='2026-08-18a';
const SEED=/*SEED_START*/[]/*SEED_END*/;
const LS='linklog_v1';

/* 씨앗 폴더 구조 — 2단계. 사용자가 만든 폴더가 늘 우선이고, 이 목록은 순서용이다. */
const BASE={
 '브랜드':['아동·유아','키즈·주니어','강아지옷','홈웨어','수영복','데일리','디자이너','빈티지·프렌치','가방·신발','주얼리','코스메틱'],
 '생산':['원단','부자재·라벨','공장·봉제','니트·편직','프린팅·자수','도매시장','외주·견적'],
 '자료':['매거진','블로그','글감','로고·그래픽','폰트','이미지'],
 '쇼핑':['편집샵(국내)','편집샵(해외)','플랫폼·몰','직구몰','스마트스토어'],
 '도구':['문서','AI·검색','마케팅','배송·물류','세무·행정','내 앱'],
 '살림':['인테리어','요리','물생활','건강','캠핑'],
 '미분류':['미분류'],
};
/* 옛 3단계·초기 체계에서 온 데이터 자동 이관 */
const OLDG={'01_브랜드':'브랜드','02_생산·실무':'생산','03_영감·자료':'자료','04_쇼핑처':'쇼핑','05_도구·시스템':'도구','06_살림·취미':'살림'};
const OLDF={'아웃도어·데일리':'데일리','컨템포러리·디자이너':'디자이너','빈티지·프렌치·에스닉':'빈티지·프렌치',
 '프린팅·자수·가공':'프린팅·자수','매거진·트렌드':'매거진','블로그·패션':'블로그','블로그·일상':'블로그',
 '블로그·그래픽':'블로그','글감·카피':'글감','이미지·무료':'이미지','마케팅·분석':'마케팅',
 '문서·드라이브':'문서','건강·운동':'건강','수영복·이너':'수영복','편집샵':'편집샵(국내)'};

let S={v:4,links:[],folders:[]};
let q='', _open={};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function favUrl(u){ const d=domainOf(u); return d?('https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=64'):''; }

/* 중복 판정은 이 함수 하나로만 */
function normUrl(u){
  try{
    const x=new URL(String(u).trim());
    const h=x.hostname.toLowerCase().replace(/^(www|m|mobile)\./,'');
    const p=x.pathname.replace(/\/+$/,'').toLowerCase();
    const keep=[];
    x.searchParams.forEach((v,k)=>{ if(!/^(utm_|fbclid|gclid|igshid|srsltid|napm|gad_|gbraid|gclsrc|ref$|src$)/i.test(k)) keep.push(k+'='+v); });
    keep.sort();
    return h+p+(keep.length?'?'+keep.join('&'):'');
  }catch(e){ return String(u||'').trim().toLowerCase(); }
}

function normLink(l){
  let g=l.group, f=l.folder||l.field||'';
  if(OLDG[g]) g=OLDG[g];
  if(OLDF[f]) f=OLDF[f];
  if(g==='쇼핑'&&(f==='편집샵(국내)')&&l.mid==='02_해외') f='편집샵(해외)';
  if(!BASE[g]&&!(S.folders||[]).some(x=>x.g===g)&&!Object.keys(BASE).includes(g)) g='';
  if(!g||/\(분류전\)$/.test(f)||f==='기타'||!f){ g='미분류'; f='미분류'; }
  return { id:l.id||uid(), title:l.title||'', url:l.url||'',
    group:g, folder:f, note:l.note||'',
    added:l.added||Date.now(), opened:l.opened||0, opens:l.opens||0,
    dead:!!l.dead, srcs:l.srcs||['직접'] };
}

function load(){
  try{ const r=localStorage.getItem(LS);
    if(r){ const d=JSON.parse(r);
      if(d&&Array.isArray(d.links)){ S={v:4,links:[],folders:Array.isArray(d.folders)?d.folders:[]}; S.links=d.links.map(normLink); return; } }
  }catch(e){}
  S={v:4,links:SEED.map(normLink),folders:[]}; save();
}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){ toast('저장 공간 부족'); } cloudPush(); }

/* ===================== 트리 ===================== */
function groupsAll(){
  const g=Object.keys(BASE).filter(x=>x!=='미분류');
  S.links.forEach(l=>{ if(l.group&&l.group!=='미분류'&&!g.includes(l.group)) g.push(l.group); });
  (S.folders||[]).forEach(f=>{ if(f.g!=='미분류'&&!g.includes(f.g)) g.push(f.g); });
  g.push('미분류'); return g;
}
function foldersAll(g){
  const f=(BASE[g]||[]).slice();
  S.links.forEach(l=>{ if(l.group===g&&!f.includes(l.folder)) f.push(l.folder); });
  (S.folders||[]).forEach(x=>{ if(x.g===g&&!f.includes(x.f)) f.push(x.f); });
  return f;
}
function tk(){ return [].slice.call(arguments).join('§'); }

function linkRow(l){
  const d=domainOf(l.url), ch=esc((l.title||d||'?').trim().charAt(0).toUpperCase());
  const fv=favUrl(l.url);
  return `<div class="tlink ${l.dead?'dead':''}" draggable="true" data-dragl="${l.id}">
    ${fv?`<img class="fi" src="${fv}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'fi txt\\'>${ch}</span>'">`
        :`<span class="fi txt">${ch}</span>`}
    <a class="t" href="${esc(l.url)}" target="_blank" rel="noopener" data-go="${l.id}" title="${esc(l.title||d)}">${esc(l.title||d)}</a>
    <span class="dm">${esc(d)}</span>
    <span class="ed" data-detail="${l.id}">…</span>
  </div>`;
}

function render(){
  const body=document.getElementById('body');
  const kw=q.trim().toLowerCase();
  if(kw){
    const arr=S.links.filter(l=>(l.title+' '+l.url+' '+l.note+' '+l.group+' '+l.folder).toLowerCase().includes(kw))
      .sort((a,b)=>b.opens-a.opens||(a.title||'').localeCompare(b.title||''));
    body.innerHTML=arr.length?`<div class="tree">${arr.slice(0,120).map(l=>
      `<div class="crumb">${esc(l.group)} › ${esc(l.folder)}</div>`+linkRow(l)).join('')}</div>`
      :`<div class="empty">찾는 링크가 없습니다</div>`;
    return;
  }
  const cg={},cf={};
  S.links.forEach(l=>{ cg[l.group]=(cg[l.group]||0)+1; cf[tk(l.group,l.folder)]=(cf[tk(l.group,l.folder)]||0)+1; });
  let h='';
  groupsAll().forEach(g=>{
    const hasUF=(S.folders||[]).some(x=>x.g===g);
    if(!cg[g]&&!hasUF&&g!=='미분류') return;
    if(g==='미분류'&&!cg[g]) return;
    const go_=!!_open[tk(g)];
    h+=`<div class="tnode g1" data-tg="${esc(tk(g))}" data-drop="${esc(tk(g))}"><span class="ar">${go_?'▾':'▸'}</span>
        <span class="nm">${esc(g)}</span><span class="cnt">${cg[g]||0}</span>
        ${g!=='미분류'?`<span class="mk" data-newf="${esc(g)}">＋</span><span class="mk" data-reng="${esc(g)}">이름</span>`:''}</div>`;
    if(!go_) return;
    foldersAll(g).forEach(f=>{
      const fk=tk(g,f), n=cf[fk]||0;
      const hasUFf=(S.folders||[]).some(x=>x.g===g&&x.f===f);
      if(!n&&!hasUFf) return;
      const fo=!!_open[fk];
      h+=`<div class="tnode g2" data-tg="${esc(fk)}" data-drop="${esc(fk)}" draggable="true" data-dragf="${esc(fk)}">
          <span class="ar">${fo?'▾':'▸'}</span><span class="nm">${esc(f)}</span><span class="cnt">${n}</span>
          ${g!=='미분류'?`<span class="mk" data-renf="${esc(fk)}">이름</span>`:''}</div>`;
      if(!fo) return;
      h+=S.links.filter(l=>l.group===g&&l.folder===f)
          .sort((a,b)=>b.opens-a.opens||(a.title||'').localeCompare(b.title||''))
          .map(linkRow).join('');
    });
  });
  body.innerHTML=`<div class="tree">${h||'<div class="empty" style="margin:0;border:0">링크가 없습니다 — 설정 → 파일 넣기</div>'}</div>`;
}

/* ===================== 빠른 입력 ===================== */
function parseUrls(s){
  return String(s||'').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean)
    .map(u=>/^https?:\/\//i.test(u)?u:'https://'+u)
    .filter(u=>/^https?:\/\/[^\s./]+\.[^\s/]+/i.test(u));
}
function quickAdd(){
  const inp=document.getElementById('qi');
  const us=parseUrls(inp.value);
  if(!us.length){ toast('주소를 붙여넣어 주세요'); inp.focus(); return; }
  let add=0,dup=0;
  us.forEach(url=>{
    if(S.links.some(l=>normUrl(l.url)===normUrl(url))){ dup++; return; }
    S.links.push(normLink({url,title:domainOf(url),group:'미분류',folder:'미분류',srcs:['직접'],added:Date.now()}));
    add++;
  });
  save(); render();
  inp.value=''; inp.focus(); document.getElementById('qres').textContent='';
  _open[tk('미분류')]=1;
  toast(add?add+'개 추가 — 미분류에 있습니다. 끌어다 놓으세요':'전부 이미 있는 주소입니다');
}
document.getElementById('qi').addEventListener('input',e=>{

document.getElementById('qi').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); quickAdd(); } });
document.getElementById('qiBtn').onclick=quickAdd;
document.getElementById('q').addEventListener('input',e=>{ q=e.target.value; render(); });

/* ===================== 설정 ===================== */
let _importMode='replace';
function isMine(l){ return (l.srcs||[]).includes('직접')||(l.opens||0)>0||!!l.note; }
function openSettings(){
  openSheet('설정',`
    <div class="kv"><span class="l">동기화</span><br><span id="syncState">확인 중…</span></div>
    <button class="btn w" id="s_auth" style="margin-bottom:14px">로그인 / 로그아웃</button>
    <div class="f"><label>파일 넣기</label>
      <div class="seg" id="impSeg">
        <b class="${_importMode==='merge'?'on':''}" data-im="merge">합치기</b>
        <b class="${_importMode==='replace'?'on':''}" data-im="replace">지우고 이 파일로</b></div>
      <div class="dropzone" id="dz">끌어다 놓거나 눌러서 파일 고르기<br>
        <span style="font-size:10px">LINK.LOG JSON · 사파리/크롬 즐겨찾기 HTML</span></div>
      <div class="note" style="margin-top:6px">「지우고 이 파일로」여도 <b>직접 추가한 것·메모 쓴 것·열어본 것은 남깁니다</b></div>
    </div>
    <button class="btn w" id="s_exp" style="margin-bottom:8px">백업 내려받기</button>
    <button class="btn danger w" id="s_reset">전부 지우기</button>
    <div class="kv" style="margin-top:14px"><span class="l">현황</span><br>링크 ${S.links.length}개 · 버전 ${APP_VER}</div>`);
  document.getElementById('syncState').textContent=fbUser?((fbUser.email||'로그인됨')+' · 폰·PC 자동 동기화'):'로그인 안 됨 — 이 기기에만 저장';
  document.getElementById('s_auth').onclick=openAuth;
  document.getElementById('impSeg').onclick=e=>{ const b=e.target.closest('b'); if(!b)return;
    _importMode=b.dataset.im;
    document.querySelectorAll('#impSeg b').forEach(x=>x.classList.toggle('on',x===b)); };
  const dz=document.getElementById('dz');
  dz.onclick=()=>document.getElementById('filePick').click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')};
  dz.ondragleave=()=>dz.classList.remove('drag');
  dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
  document.getElementById('s_exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='linklog-backup.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  document.getElementById('s_reset').onclick=()=>{
    if(!confirm('링크 '+S.links.length+'개를 전부 지웁니다. 계속할까요?'))return;
    if(!confirm('정말 지울까요? 되돌릴 수 없습니다.'))return;
    S={v:4,links:[],folders:[]}; save(); render(); closeSheet(); toast('전부 지웠습니다');
  };
}
document.getElementById('setBtn').onclick=openSettings;
document.getElementById('filePick').onchange=e=>{ if(e.target.files[0]) readFile(e.target.files[0]); e.target.value=''; };

function readFile(file){
  const r=new FileReader();
  r.onload=()=>{
    const txt=String(r.result), n=file.name.toLowerCase();
    try{
      if(n.endsWith('.json')) importJson(txt,_importMode);
      else importNetscape(txt, /safari|사파리/i.test(n)?'사파리':'크롬');
    }catch(e){ console.error(e); toast('파일을 읽지 못했습니다'); }
  };
  r.readAsText(file);
}
function importJson(text,mode){
  const d=JSON.parse(text);
  if(!d||!Array.isArray(d.links)){ toast('LINK.LOG 파일이 아닙니다'); return; }
  const inc=d.links.map(normLink);
  if(mode==='replace'){
    const inSet={}; inc.forEach(x=>inSet[normUrl(x.url)]=1);
    const keep=S.links.filter(l=>!inSet[normUrl(l.url)]&&isMine(l));
    const byUrl={}; S.links.forEach(l=>byUrl[normUrl(l.url)]=l);
    S.links=inc.map(x=>{
      const o=byUrl[normUrl(x.url)]; if(!o) return x;
      x.opens=Math.max(x.opens||0,o.opens||0); x.opened=Math.max(x.opened||0,o.opened||0);
      x.note=x.note||o.note; (o.srcs||[]).forEach(s=>{ if(!x.srcs.includes(s))x.srcs.push(s); });
      return x;
    }).concat(keep);
    S.folders=Array.isArray(d.folders)?d.folders:(S.folders||[]);
    save(); render(); closeSheet();
    toast('파일로 바꿨습니다 — '+inc.length+'개'+(keep.length?' (내가 만진 '+keep.length+'개 유지)':''));
    return;
  }
  let add=0;
  inc.forEach(x=>{ if(!S.links.some(l=>normUrl(l.url)===normUrl(x.url))){ S.links.push(x); add++; } });
  save(); render(); closeSheet(); toast('새로 '+add+'개 추가');
}
function importNetscape(html,src){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const as=[...doc.querySelectorAll('a[href]')];
  if(!as.length){ toast('즐겨찾기를 찾지 못했습니다'); return; }
  let add=0;
  as.forEach(a=>{
    const url=a.getAttribute('href')||'';
    if(!/^https?:/i.test(url)) return;
    if(S.links.some(l=>normUrl(l.url)===normUrl(url))) return;
    S.links.push(normLink({url,title:(a.textContent||'').trim()||domainOf(url),
      group:'미분류',folder:'미분류',srcs:[src],added:Date.now()}));
    add++;
  });
  save(); render(); closeSheet(); _open[tk('미분류')]=1;
  toast(src+' — 새로 '+add+'개 (미분류)');
}

/* ===================== 클릭 · 드래그 ===================== */
document.addEventListener('click',e=>{
  const go_=e.target.closest('[data-go]');
  if(go_){ const l=S.links.find(x=>x.id===go_.dataset.go);
    if(l){ l.opens=(l.opens||0)+1; l.opened=Date.now(); save(); } return; }
  const dt=e.target.closest('[data-detail]'); if(dt){ openDetail(dt.dataset.detail); return; }

  const nf=e.target.closest('[data-newf]');
  if(nf){ e.stopPropagation();
    const g=nf.dataset.newf;
    const f=prompt('「'+g+'」 안에 새 폴더 이름'); if(!f||!f.trim())return;
    S.folders=(S.folders||[]).concat([{g:g,f:f.trim()}]);
    _open[tk(g)]=1; save(); render(); toast('만들었습니다'); return; }
  const rg=e.target.closest('[data-reng]');
  if(rg){ e.stopPropagation();
    const g=rg.dataset.reng;
    const nv=prompt('대분류 이름 바꾸기',g); if(nv===null)return;
    const v=nv.trim(); if(!v||v===g)return;
    S.links.forEach(l=>{ if(l.group===g)l.group=v; });
    S.folders=(S.folders||[]).map(x=>x.g===g?{g:v,f:x.f}:x);
    if(_open[tk(g)]){ _open[tk(v)]=1; }
    save(); render(); toast('바꿨습니다'); return; }
  const rf=e.target.closest('[data-renf]');
  if(rf){ e.stopPropagation();
    const p=rf.dataset.renf.split('§');
    const nv=prompt('폴더 이름 바꾸기',p[1]); if(nv===null)return;
    const v=nv.trim(); if(!v||v===p[1])return;
    S.links.forEach(l=>{ if(l.group===p[0]&&l.folder===p[1])l.folder=v; });
    S.folders=(S.folders||[]).map(x=>(x.g===p[0]&&x.f===p[1])?{g:x.g,f:v}:x);
    save(); render(); toast('바꿨습니다'); return; }

  const tg=e.target.closest('[data-tg]');
  if(tg){ _open[tg.dataset.tg]=!_open[tg.dataset.tg]; render(); return; }
});
document.getElementById('expAll').onclick=()=>{ S.links.forEach(l=>_open[tk(l.group)]=1); render(); };
document.getElementById('colAll').onclick=()=>{ _open={}; render(); };
document.getElementById('newGroup').onclick=()=>{
  const g=prompt('새 대분류 이름'); if(!g||!g.trim())return;
  const f=prompt('그 안에 첫 폴더 이름 (비우면 「기본」)')||'기본';
  S.folders=(S.folders||[]).concat([{g:g.trim(),f:f.trim()||'기본'}]);
  _open[tk(g.trim())]=1; save(); render(); toast('만들었습니다');
};

let _drag=null;
document.addEventListener('dragstart',e=>{
  const l=e.target.closest&&e.target.closest('[data-dragl]');
  const f=e.target.closest&&e.target.closest('[data-dragf]');
  if(l){ _drag={type:'link',id:l.dataset.dragl}; l.classList.add('dragging'); }
  else if(f){ _drag={type:'folder',key:f.dataset.dragf}; f.classList.add('dragging'); }
  else return;
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','x'); }catch(x){}
});
document.addEventListener('dragend',()=>{ _drag=null; document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')); });
document.addEventListener('dragover',e=>{
  e.preventDefault();
  const t=e.target.closest&&e.target.closest('[data-drop]');
  document.querySelectorAll('.tnode.over').forEach(x=>{ if(x!==t)x.classList.remove('over'); });
  if(t&&_drag) t.classList.add('over');
});
document.addEventListener('drop',e=>{
  e.preventDefault();
  const t=e.target.closest&&e.target.closest('[data-drop]');
  document.querySelectorAll('.tnode.over').forEach(x=>x.classList.remove('over'));
  if(!t||!_drag) return;
  const p=t.dataset.drop.split('§');           /* [g] 또는 [g,f] */
  if(_drag.type==='link'){
    const g=p[0], f=p[1]||foldersAll(g).find(x=>S.links.some(l=>l.group===g&&l.folder===x))||(BASE[g]||['기본'])[0];
    const l=S.links.find(x=>x.id===_drag.id); if(!l)return;
    l.group=g; l.folder=f;
    _open[tk(g)]=1; save(); render(); toast(g+' › '+f+'(으)로 옮겼습니다');
  } else {
    if(p.length>1){ toast('폴더는 대분류에 놓으세요'); return; }
    const s0=_drag.key.split('§'), g=p[0];
    let n=0;
    S.links.forEach(l=>{ if(l.group===s0[0]&&l.folder===s0[1]){ l.group=g; n++; } });
    S.folders=(S.folders||[]).map(x=>(x.g===s0[0]&&x.f===s0[1])?{g:g,f:x.f}:x);
    if(!(S.folders||[]).some(x=>x.g===g&&x.f===s0[1])&&!n) S.folders=(S.folders||[]).concat([{g:g,f:s0[1]}]);
    _open[tk(g)]=1; save(); render(); toast('폴더 「'+s0[1]+'」 '+n+'개를 옮겼습니다');
  }
  _drag=null;
});

/* ===================== Firebase 동기화 (fpf-manager 재활용 · 문서 linklog) ===================== */
const FB_CONFIG={apiKey:"AIzaSyCx84fnTSZl9_eTMaUkts0VCyIx4qrql2I",authDomain:"fpf-manager.firebaseapp.com",projectId:"fpf-manager",storageBucket:"fpf-manager.firebasestorage.app",messagingSenderId:"415966666310",appId:"1:415966666310:web:9c4bb75cd2594cc744b447"};
let fbUser=null,fbAuth=null,fbDB=null,_rtUnsub=null,_pushT=null,_pushedTs='',_pendingCloud=null;
function initFb(att){
  att=att||0;
  if(typeof firebase==='undefined'){ if(att<40)setTimeout(()=>initFb(att+1),150); return; }
  try{
    firebase.initializeApp(FB_CONFIG); fbAuth=firebase.auth(); fbDB=firebase.firestore();
    fbAuth.onAuthStateChanged(u=>{ fbUser=u; setAcct(); if(u) startCloudSync(); else stopCloudSync(); });
  }catch(e){ console.error(e); }
}
function setAcct(){
  const b=document.getElementById('acctBtn');
  b.textContent=fbUser?((fbUser.email||'').split('@')[0]||'계정'):'로그인';
  b.style.background=fbUser?'var(--ink)':''; b.style.color=fbUser?'var(--paper)':''; b.style.borderColor=fbUser?'var(--ink)':'';
}
function cloudRef(){ return fbDB.collection('users').doc(fbUser.uid).collection('data').doc('linklog'); }
function cloudPush(){
  if(!fbUser||!fbDB)return;
  clearTimeout(_pushT);
  _pushT=setTimeout(()=>{
    const ts=Date.now()+'_'+Math.floor(Math.random()*100000); _pushedTs=ts;
    cloudRef().set({value:JSON.stringify(S),ts:ts,at:new Date().toISOString()})
      .catch(e=>{ console.error(e); if(e.code==='permission-denied')toast('동기화 권한 오류'); });
  },700);
}
function startCloudSync(){
  if(!fbUser||!fbDB)return;
  if(_rtUnsub){try{_rtUnsub()}catch(e){} _rtUnsub=null;}
  let first=true;
  _rtUnsub=cloudRef().onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.exists){ cloudPush(); first=false; return; }
    const d=snap.data(); if(!d||!d.value)return;
    if(d.ts&&d.ts===_pushedTs)return;
    let data; try{ data=JSON.parse(d.value); }catch(e){ return; }
    if(!data||!Array.isArray(data.links))return;
    if(isBusy()){ _pendingCloud=data; return; }
    applyCloud(data,!first); first=false;
  },e=>{ console.error(e); if(e.code==='permission-denied')toast('동기화 권한 오류'); });
}
function stopCloudSync(){ if(_rtUnsub){try{_rtUnsub()}catch(e){} _rtUnsub=null;} }
function isBusy(){
  if(document.querySelector('.sheet.on'))return true;
  const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value);
}
function flushPendingCloud(){ if(_pendingCloud&&!isBusy()){ const d=_pendingCloud; _pendingCloud=null; applyCloud(d,true); } }
function applyCloud(data,notify){
  S.folders=Array.isArray(data.folders)?data.folders:(S.folders||[]);
  S.links=(data.links||[]).map(normLink);
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  render();
  if(notify)toast('다른 기기 변경이 반영됐어요');
}
function openAuth(){
  if(fbUser){
    openSheet('내 계정',`
      <div class="kv"><span class="l">로그인됨</span><br>${esc(fbUser.email||'')}</div>
      <div class="note">폰·PC 어디서나 같은 링크로 보입니다. FPF · 머니 · 핏로그와 같은 계정입니다.</div>
      <button class="btn danger w" id="doOut" style="margin-top:12px">로그아웃</button>`);
    document.getElementById('doOut').onclick=()=>{ fbAuth.signOut(); closeSheet(); toast('로그아웃했습니다'); };
    return;
  }
  openSheet('로그인',`
    <div class="note" style="margin-top:0">로그인하면 폰과 PC가 같은 링크를 봅니다.<br>FPF · 머니 · 핏로그와 같은 계정을 쓰세요.</div>
    <div class="f" style="margin-top:12px"><label>이메일</label><input id="li_e" type="email" autocomplete="username"></div>
    <div class="f"><label>비밀번호</label><input id="li_p" type="password" autocomplete="current-password"></div>
    <button class="btn fill w" id="doIn">로그인</button>`);
  document.getElementById('doIn').onclick=()=>{
    if(!fbAuth){toast('연결 준비 중입니다');return;}
    fbAuth.signInWithEmailAndPassword(document.getElementById('li_e').value.trim(),document.getElementById('li_p').value)
      .then(()=>{closeSheet();toast('로그인했습니다');}).catch(e=>toast('로그인 실패 — '+(e.code||'')));
  };
}
document.getElementById('acctBtn').onclick=openAuth;

/* ===================== 시작 ===================== */
document.getElementById('ver').textContent=APP_VER;
load(); render(); setAcct(); initFb();
