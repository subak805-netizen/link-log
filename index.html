<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LINK.LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* ===================== 토큰 (FIT.LOG DESIGN_GUIDE 그대로) ===================== */
:root{
  --paper:#FFFFFF; --panel:#FBF8F3; --dim:#F2EBE0; --beige:#E3D8C6;
  --ink:#181613; --mut:#8B8377;
  --olive:#5F6B33; --terra:#C25E3A; --gold:#EBC63C;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13px; line-height:1.5; color:var(--ink); background:var(--paper);
  overflow-wrap:anywhere; -webkit-text-size-adjust:100%; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;border-radius:0}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
.num{font-family:Doto,ui-monospace,monospace;font-weight:900;letter-spacing:.02em}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===================== 레이아웃 ===================== */
.app{max-width:1320px;margin:0 auto;display:block}
.side{display:none}
.shell{padding:0 0 78px}
.tabpage{max-width:1000px;margin:0 auto;padding:0 12px}
.hidden{display:none !important}

.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.logo{display:flex;align-items:baseline;gap:5px;min-width:0}
.logo b{font-family:Doto,monospace;font-weight:900;font-size:20px}
.logo .dot{width:7px;height:7px;background:var(--terra);display:inline-block}
.logo em{font-style:normal;font-size:9px;letter-spacing:.16em;color:var(--mut)}
.acct{font-size:9.5px;letter-spacing:.12em;color:var(--mut);border:1px solid var(--beige);padding:5px 8px;white-space:nowrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:2px solid var(--ink);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.tabbar b{padding:10px 2px 12px;text-align:center;font-size:10px;font-weight:800;color:var(--mut);
  border-right:1px solid var(--beige);cursor:pointer;letter-spacing:.02em}
.tabbar b:last-child{border-right:0}
.tabbar b.on{background:var(--ink);color:var(--paper)}

.sec{display:flex;align-items:baseline;gap:7px;margin:var(--sp4) 0 var(--sp2);flex-wrap:wrap}
.sec h2{font-size:14px;font-weight:800}
.sec span{font-size:9px;letter-spacing:.14em;color:var(--mut)}
.sec .grow{flex:1}

/* 검색 · 세그 · 칩 */
.searchrow{display:flex;gap:6px;margin-top:var(--sp3)}
.searchrow input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--paper);padding:8px 10px;font-size:12.5px}
.searchrow input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--gold)}
.seg{display:flex;border:2px solid var(--ink);margin-top:var(--sp2)}
.seg b{flex:1;text-align:center;padding:7px 4px;font-size:11px;font-weight:800;color:var(--mut);
  border-right:1px solid var(--ink);cursor:pointer}
.seg b:last-child{border-right:0}
.seg b.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--sp2);align-items:center}
.chip{font-size:10px;padding:4px 7px;border:1px solid var(--beige);background:var(--panel);color:var(--mut);
  cursor:pointer;letter-spacing:.04em;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.g{font-size:11px;padding:6px 9px;border-color:var(--ink);color:var(--ink);font-weight:800}
.chip.g.on{background:var(--ink);color:var(--paper)}
.chip.todo{border-color:var(--gold);background:var(--gold);color:var(--ink);font-weight:800}
.chip.todo.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.flab{font-size:9px;letter-spacing:.14em;color:var(--mut);align-self:center;padding-right:2px;white-space:nowrap}

.btn{border:2px solid var(--ink);background:var(--paper);padding:8px 12px;font-size:11.5px;font-weight:800;
  letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--terra);color:var(--terra)}
.btn.sm{padding:6px 9px;font-size:10.5px;border-width:1px}
.btn.w{width:100%}

/* ===================== 링크 행 ===================== */
.llist{border:2px solid var(--ink);margin-top:var(--sp3)}
.lrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:9px 10px;border-bottom:1px solid var(--beige);cursor:pointer;background:var(--paper)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--panel)}
.lrow.dead{opacity:.5}
.fico{width:20px;height:20px;display:block;object-fit:contain;background:var(--dim)}
.fico.txt{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mut)}
.lmain{min-width:0}
.lttl{font-size:12.5px;font-weight:800;line-height:1.35;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lsub{font-size:9.5px;color:var(--mut);margin-top:3px;letter-spacing:.03em;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.lgo{border:1px solid var(--ink);padding:6px 9px;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-decoration:none;white-space:nowrap}
.lgo:hover{background:var(--ink);color:var(--paper)}

.tag{font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border:1px solid var(--beige);color:var(--mut)}
.tag.fold{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tag.todo{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.tag.bad{background:var(--terra);border-color:var(--terra);color:#fff}
.src{font-size:8.5px;letter-spacing:.1em;color:var(--mut);border:1px solid var(--beige);padding:1px 4px}

.empty{border:2px dashed var(--beige);background:var(--panel);padding:26px 14px;text-align:center;
  color:var(--mut);font-size:11.5px;line-height:1.9;margin-top:var(--sp3)}

/* 빠른 입력 (FPF 택배 시재 빠른입력 방식 — 창을 열지 않고 늘 떠 있는 한 줄) */
.quick{border:2px solid var(--ink);background:var(--panel);padding:10px;margin-top:var(--sp3)}
.quick .qtop{display:flex;align-items:baseline;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.quick .qtop b{font-size:12px;font-weight:800}
.quick .qtop span{font-size:9px;letter-spacing:.12em;color:var(--mut)}
.quick .qtop .grow{flex:1}
.quick .qin{display:flex;gap:6px}
.quick .qin input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--paper);padding:9px 10px;font-size:12.5px}
.quick .qin input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--gold)}
.quick .qin button{border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:9px 12px;font-size:11.5px;font-weight:800;white-space:nowrap;letter-spacing:.03em}
.quick .qhint{font-size:9.5px;color:var(--mut);margin-top:6px;line-height:1.7}
.quick .qres{font-size:11px;margin-top:7px;padding:7px 9px;border:1px solid var(--beige);background:var(--paper);line-height:1.7}
.quick .qres b{font-weight:800}

/* 트리 (사파리 즐겨찾기 창 방식) — 촘촘하게, 제목 누르면 바로 열림 */
.tree{border:2px solid var(--ink);margin-top:var(--sp3)}
.tnode{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--beige);
  cursor:pointer;font-size:12px;font-weight:800;background:var(--paper)}
.tnode:last-child{border-bottom:0}
.tnode .ar{width:9px;font-size:9px;color:var(--mut);flex:none}
.tnode .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .cnt{font-family:Doto,monospace;font-weight:700;font-size:12px;color:var(--mut);flex:none}
.tnode.g1{background:var(--ink);color:var(--paper);border-bottom:1px solid var(--ink)}
.tnode.g1 .ar,.tnode.g1 .cnt{color:var(--paper);opacity:.7}
.tnode.g2{padding-left:22px;background:var(--panel);font-size:11.5px}
.tnode.g3{padding-left:36px;font-weight:700;font-size:11.5px}
.tnode.on{box-shadow:inset 3px 0 0 var(--gold)}
.tlink{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 36px;
  border-bottom:1px solid var(--beige);font-size:11.5px;background:var(--paper)}
.tlink:last-child{border-bottom:0}
.tlink:hover{background:var(--panel)}
.tlink .fi{width:15px;height:15px;flex:none;object-fit:contain;background:var(--dim)}
.tlink .fi.txt{display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--mut)}
.tlink .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer;text-decoration:none}
.tlink .t:hover{text-decoration:underline}
.tlink .dm{font-size:9px;color:var(--mut);flex:none;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink .ed{flex:none;font-size:10px;color:var(--mut);border:1px solid var(--beige);padding:2px 5px;cursor:pointer}
.tlink.dead .t{opacity:.45;text-decoration:line-through}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--sp2);align-items:center}

.wake{border:2px solid var(--ink);background:var(--panel);margin-top:var(--sp3)}
.wake .wh{padding:9px 11px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;
  align-items:center;gap:8px;flex-wrap:wrap}
.wake .wh b{font-size:12px;font-weight:800}
.wake .wh span{font-size:9px;letter-spacing:.13em;color:var(--mut)}
.wake .lrow{background:var(--panel)}
.wake .lrow:hover{background:var(--paper)}

.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink);margin-top:var(--sp3)}
.stat4 div{padding:10px 4px;text-align:center;border-right:1px solid var(--beige)}
.stat4 div:last-child{border-right:0}
.stat4 i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.12em;color:var(--mut);margin-top:3px}
.stat4 b{font-family:Doto,monospace;font-weight:900;font-size:19px}

/* 빠른 분류 */
.qs{border:2px solid var(--ink);margin-top:var(--sp3)}
.qs .qh{padding:9px 10px;border-bottom:1px solid var(--ink);display:grid;
  grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center}
.qs .qp{padding:8px 10px 10px;background:var(--panel);border-bottom:2px solid var(--ink)}
.qs .qp:last-child{border-bottom:0}
.qs .qp .pick{margin-top:6px}
.qs .qlab{font-size:9px;letter-spacing:.13em;color:var(--mut)}

.btab{border:2px solid var(--ink);margin-top:var(--sp3);overflow:hidden}
.brow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:9px 10px;border-bottom:1px solid var(--beige);cursor:pointer}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--panel)}
.bmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

/* ===================== 모달 / 바텀시트 ===================== */
.mask{position:fixed;inset:0;background:rgba(24,22,19,.42);z-index:80;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--paper);border-top:2px solid var(--ink);
  max-height:92vh;overflow:auto;display:none;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{display:block}
.shd{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px}
.shd b{font-size:13px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shd .x{font-size:11px;font-weight:800;color:var(--mut);padding:4px 6px;cursor:pointer;letter-spacing:.1em}
.sbd{padding:12px 12px 20px;max-width:760px;margin:0 auto}

.f{margin-bottom:var(--sp3)}
.f>label{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--mut);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;border:2px solid var(--ink);background:var(--paper);padding:8px 9px;font-size:12.5px}
.f textarea{min-height:64px;resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;box-shadow:inset 0 0 0 2px var(--gold)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:4px}
.pick b{border:1px solid var(--beige);background:var(--panel);color:var(--mut);padding:6px 9px;
  font-size:11px;font-weight:800;cursor:pointer}
.pick b.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.kv{border:1px solid var(--beige);background:var(--panel);padding:9px 10px;margin-bottom:var(--sp2)}
.kv .l{font-size:9.5px;letter-spacing:.13em;color:var(--mut)}
.kv .v{font-size:12.5px;margin-top:3px;line-height:1.65;white-space:pre-wrap}

.note{border:2px solid var(--beige);background:var(--panel);padding:12px;margin-top:var(--sp3);
  font-size:11px;color:var(--mut);line-height:1.9}
.note b{color:var(--ink);font-size:11.5px}

.dropzone{border:2px dashed var(--ink);background:var(--panel);padding:22px 14px;text-align:center;
  font-size:11.5px;color:var(--mut);line-height:1.9;margin-top:var(--sp2);cursor:pointer}
.dropzone.drag{box-shadow:inset 0 0 0 3px var(--gold);background:var(--dim)}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--paper);
  padding:9px 14px;font-size:11.5px;font-weight:800;letter-spacing:.03em;opacity:0;pointer-events:none;
  transition:opacity .18s;max-width:88vw;text-align:center}
.toast.on{opacity:1}

@media(min-width:960px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr)}
  .topbar{display:none}
  .tabbar{display:none}
  .side{display:block;position:sticky;top:0;height:100vh;border-right:2px solid var(--ink);background:var(--panel);
    padding:18px 14px;overflow:auto}
  .side .logo{margin-bottom:22px}
  .side nav b{display:block;padding:10px 11px;font-size:12.5px;font-weight:800;color:var(--mut);
    border:1px solid transparent;cursor:pointer;margin-bottom:3px}
  .side nav b.on{background:var(--ink);color:var(--paper)}
  .side .acct{display:block;width:100%;margin-top:22px;text-align:center}
  .shell{padding:22px 0 40px}
  .searchrow,.seg{max-width:520px}
  .sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(720px,92vw);
    max-height:88vh;border:2px solid var(--ink)}
  .toast{bottom:32px}
}
@media(max-width:959px){ .app{max-width:430px;margin:0 auto} }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo"><b>LINK</b><i class="dot"></i><b>LOG</b></div>
    <nav id="nav"></nav>
    <button class="acct" id="acctPc">게스트 · 이 기기에만 저장</button>
  </aside>

  <div>
    <header class="topbar">
      <div class="logo"><b>LINK</b><i class="dot"></i><b>LOG</b><em>&nbsp;BOOKMARKS</em></div>
      <span id="verMo" style="font-size:8px;letter-spacing:.1em;color:var(--mut)"></span>
      <button class="acct" id="acctMo">게스트</button>
    </header>

    <main class="shell">
      <section class="tabpage" data-page="home">
        <div class="sec"><h2>관리</h2><span>MANAGE</span></div>
        <div id="quickHome"></div>
        <div id="homeStat"></div>
        <div id="homeWake"></div>
        <div class="sec"><h2>자주 여는 것</h2><span>OFTEN</span></div>
        <div id="homeOften"></div>
        <div class="sec"><h2>최근 저장</h2><span>RECENT</span></div>
        <div id="homeRecent"></div>
      </section>

      <section class="tabpage hidden" data-page="all">
        <div class="sec"><h2>홈</h2><span>HOME</span></div>
        <div id="quickAll"></div>
        <div class="searchrow"><input id="q" placeholder="제목 · 주소 · 폴더 · 메모 검색"></div>
        <div class="chips" id="groupChips"></div>
        <div class="chips" id="folderPickRow"></div>
        <div id="allBody"></div>
      </section>

      <section class="tabpage hidden" data-page="brand">
        <div class="sec"><h2>브랜드</h2><span>BRAND</span></div>
        <div class="searchrow"><input id="bq" placeholder="브랜드명 · 주소 검색"></div>
        <div class="chips" id="bfolderChips"></div>
        <div class="chips" id="bcountryChips"></div>
        <div id="brandBody"></div>
      </section>

      <section class="tabpage hidden" data-page="clean">
        <div class="sec"><h2>정리</h2><span>CLEAN</span></div>
        <div class="seg" id="cleanSeg">
          <b class="on" data-v="folder">폴더</b><b data-v="auto">자동분류</b><b data-v="import">가져오기</b>
          <b data-v="dup">중복</b><b data-v="dead">죽은링크</b><b data-v="data">데이터</b>
        </div>
        <div id="cleanBody"></div>
      </section>
    </main>
  </div>
</div>

<div class="tabbar" id="tabbar"></div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="shd"><b id="shTitle"></b><span class="x" id="shX">닫기</span></div><div class="sbd" id="shBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept=".html,.htm,.csv,.json" style="display:none">

<script>
const SEED = /*SEED_START*/[]/*SEED_END*/;

/* ===================== 분류 체계 =====================
   대분류(group)는 찾아 들어가는 입구일 뿐이고,
   실제 분류는 사파리·크롬에서 쓰던 폴더 이름(folder) 그대로 쓴다.
   폴더는 고정 목록이 아니라 데이터에서 뽑는다 — 가져오기로 새 폴더가 생기면 자동으로 나타난다. */
/* 3단계 위계: 대분류 → 중분류 → 폴더.
   기준을 품목·타겟으로 단일화하고, 분위기(프렌치·빈티지…)는 폴더가 아니라 태그로 뺀다.
   한 화면에 7개 넘게 늘어놓지 않기 위해 중분류를 둔다. 두 자리 번호는 정렬이 꼬이지 않게. */
const TAX={
 '01_브랜드':{'01_의류·타겟':['아동·유아','키즈·주니어','강아지옷','홈웨어','수영복·이너','아웃도어·데일리'],
              '02_스타일':['컨템포러리·디자이너','빈티지·프렌치·에스닉'],
              '03_잡화·뷰티':['가방·신발','주얼리','코스메틱']},
 '02_생산·실무':{'01_원부자재':['원단','부자재·라벨'],
                 '02_공정':['공장·봉제','니트·편직','프린팅·자수·가공'],
                 '03_유통·견적':['도매시장','외주·견적']},

function normLink(l){
  let group=l.group, mid=l.mid, folder=l.folder||l.field;
  /* 옛 체계에서 올라온 레코드도 새 자리에 앉힌다 */
  if(!GROUPS.includes(group)||!folder){
    const p=placeOf(folder||'');
    group=p[0]; mid=p[1]; folder=p[2];
  } else if(!mid||!seedFoldersOf(group,mid).length){
    mid=midOf(group,folder)||midsOf(group)[0];
  }
  return {
    id:l.id||uid(), title:l.title||'', url:l.url||'',
    group:group, mid:mid, folder:folder, note:l.note||'',
    tags:Array.isArray(l.tags)?l.tags:[],
    added:l.added||Date.now(), opened:l.opened||0, opens:l.opens||0,
    dead:!!l.dead, srcs:l.srcs||['직접'],
    bcat:l.bcat||'', bcountry:l.bcountry||'', bprice:l.bprice||''
  };
}
function midOf(g,folder){
  const ms=TAX[g]||{};
  for(const m in ms){ if(ms[m].includes(folder)) return m; }
  return '';
}
/* 폴더 이름만 알 때 자리를 찾아준다 */
function placeOf(folder){
  for(const g of GROUPS){ const m=midOf(g,folder); if(m) return [g,m,folder]; }
  return ['01_브랜드','01_의류·타겟','아웃도어·데일리'];
}
function groupOf(folder){ return placeOf(folder)[0]; }
/* 실제 데이터에 있는 폴더 목록 (개수 많은 순) */
function foldersOf(group){
  const c={};
  S.links.forEach(l=>{ if(!group||l.group===group) c[l.folder]=(c[l.folder]||0)+1; });
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).map(f=>[f,c[f]]);
}

/* ===================== URL 정규화 (중복 판정의 유일한 기준) ===================== */
function normUrl(u){
  try{
    const x=new URL(String(u).trim());
    const h=x.hostname.toLowerCase().replace(/^(www|m|mobile)\./,'');
    const p=x.pathname.replace(/\/+$/,'').toLowerCase();
    const keep=[];
    x.searchParams.forEach((v,k)=>{
      if(!/^(utm_|fbclid|gclid|igshid|srsltid|napm|gad_|gbraid|gclsrc|ref$|src$)/i.test(k)) keep.push(k+'='+v);
    });
    keep.sort();
    return h+p+(keep.length?'?'+keep.join('&'):'');
  }catch(e){ return String(u||'').trim().toLowerCase(); }
}
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function favUrl(u){ const d=domainOf(u); return d?('https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=64'):''; }
function daysAgo(ms){ return Math.floor((Date.now()-ms)/86400000); }
/* 검색 대상 — 폴더 이름까지 포함해야 "폰트"로 폰트 사이트가 나온다 */
function hay(l){ return [l.title,l.url,l.note,l.group,l.folder,l.bcat,l.bcountry,l.bprice].join(' ').toLowerCase(); }

function fico(l){
  const f=favUrl(l.url), ch=esc((l.title||domainOf(l.url)||'?').trim().charAt(0).toUpperCase());
  if(!f) return `<span class="fico txt">${ch}</span>`;
  return `<img class="fico" src="${f}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'fico txt\\'>${ch}</span>'">`;
}
function rowHtml(l){
  const d=domainOf(l.url);
  const srcs=(l.srcs||[]).map(s=>`<span class="src">${esc(s)}</span>`).join('');
  return `<div class="lrow ${l.dead?'dead':''}" data-id="${l.id}">

    </div>
    <a class="lgo" href="${esc(l.url)}" target="_blank" rel="noopener" data-go="${l.id}">열기</a>
  </div>`;
}
function listHtml(arr,emptyMsg){
  if(!arr.length) return `<div class="empty">${emptyMsg||'없습니다'}</div>`;

/* ===================== 트리 (사파리 즐겨찾기 창 방식) =====================
   저장보다 "빨리 열어보기"가 목적. 행을 촘촘히, 제목을 누르면 상세가 아니라 바로 열린다.
   고치고 싶을 때만 오른쪽 「…」 */
let _open={}, _tIdx=[];
function tkey(){ return [].slice.call(arguments).join('§'); }
function treeLinkRow(l){
  const i=_tIdx.push(l.id)-1;
  const d=domainOf(l.url), ch=esc((l.title||d||'?').trim().charAt(0).toUpperCase());
  const f=favUrl(l.url);
  return `<div class="tlink ${l.dead?'dead':''}">
    ${f?`<img class="fi" src="${f}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'fi txt\\'>${ch}</span>'">`
       :`<span class="fi txt">${ch}</span>`}
    <a class="t" href="${esc(l.url)}" target="_blank" rel="noopener" data-go="${l.id}"
       title="${esc(l.title||d)}">${esc(l.title||d)}</a>
    <span class="dm">${esc(d)}</span>
    <span class="ed" data-detail="${l.id}">…</span>
  </div>`;
}
function renderTree(){
  _tIdx=[];
  const L=S.links.filter(l=>!tagF||(l.tags||[]).includes(tagF));
  const cg={},cm={},cf={};
  L.forEach(l=>{ cg[l.group]=(cg[l.group]||0)+1;
    cm[tkey(l.group,l.mid)]=(cm[tkey(l.group,l.mid)]||0)+1;
    cf[tkey(l.group,l.mid,l.folder)]=(cf[tkey(l.group,l.mid,l.folder)]||0)+1; });
  let h='';
  GROUPS.forEach(g=>{
    if(!cg[g]) return;
    const gk=tkey(g), go_=!!_open[gk];
    h+=`<div class="tnode g1" data-tg="${esc(gk)}"><span class="ar">${go_?'▾':'▸'}</span>
        <span class="nm">${esc(g)}</span><span class="cnt">${cg[g]}</span></div>`;
    if(!go_) return;
    midsOf(g).forEach(m=>{
      const mk=tkey(g,m); if(!cm[mk]) return;
      const mo=!!_open[mk];
      h+=`<div class="tnode g2" data-tg="${esc(mk)}"><span class="ar">${mo?'▾':'▸'}</span>
          <span class="nm">${esc(m)}</span><span class="cnt">${cm[mk]}</span></div>`;
      if(!mo) return;
      seedFoldersOf(g,m).concat(
        [...new Set(L.filter(l=>l.group===g&&l.mid===m).map(l=>l.folder))]
      ).filter((v,i,a)=>a.indexOf(v)===i).forEach(f=>{
        const fk=tkey(g,m,f); if(!cf[fk]) return;
        const fo=!!_open[fk];
        h+=`<div class="tnode g3 ${fo?'on':''}" data-tg="${esc(fk)}"><span class="ar">${fo?'▾':'▸'}</span>
            <span class="nm">${esc(f)}</span><span class="cnt">${cf[fk]}</span></div>`;
        if(!fo) return;
        h+=L.filter(l=>l.group===g&&l.mid===m&&l.folder===f)
             .sort((a,b)=>b.opens-a.opens||(a.title||'').localeCompare(b.title||''))
             .map(treeLinkRow).join('');
      });
    });
  });
  return `<div class="tree">${h||'<div class="empty" style="margin:0">링크가 없습니다</div>'}</div>`;
}

  }

  fRow.innerHTML=`<b class="chip" id="expAll">모두 펴기</b><b class="chip" id="colAll">모두 접기</b>`;

/* ---------- 정리 ---------- */
function dupGroups(){
  const m={};

  return Object.keys(m).filter(k=>m[k].length>1).map(k=>m[k]);
}
let _qsIdx=[];

  document.querySelectorAll('#cleanSeg b').forEach(b=>b.classList.toggle('on',b.dataset.v===cleanView));
  const body=document.getElementById('cleanBody');

  if(cleanView==='folder'){
    /* 폴더 관리 — 이름 바꾸기·합치기·옮기기. 폴더 안의 링크는 그대로 따라간다. */
    const todo=S.links.filter(needsSort).length;
    let h=`<div class="sec"><h2>폴더 관리</h2><span>폴더 ${foldersOf('').length}개</span></div>
      <div class="note" style="margin-top:6px">이름을 바꾸거나 두 폴더를 합칠 수 있습니다.
        <b>링크는 사라지지 않고 폴더를 따라 움직입니다.</b>${todo?'<br>제자리를 못 찾은 링크 '+todo+'개는 아래 「정리 필요」에 모아뒀습니다.':''}</div>`;
    _fmIdx=[];
    GROUPS.forEach(g=>{
      const inG=S.links.filter(l=>l.group===g);
      if(!inG.length) return;
      h+=`<div class="tree" style="margin-top:12px">
        <div class="tnode g1"><span class="nm">${esc(g)}</span><span class="cnt">${inG.length}</span></div>`;
      midsOf(g).concat([...new Set(inG.map(l=>l.mid))]).filter((v,i,a)=>a.indexOf(v)===i).forEach(m=>{
        const inM=inG.filter(l=>l.mid===m); if(!inM.length) return;
        h+=`<div class="tnode g2"><span class="nm">${esc(m)}</span><span class="cnt">${inM.length}</span></div>`;
        [...new Set(inM.map(l=>l.folder))].sort().forEach(f=>{
          const n=inM.filter(l=>l.folder===f).length;
          const i=_fmIdx.push({g:g,m:m,f:f})-1;
          h+=`<div class="tnode g3" style="cursor:default">
                <span class="nm">${esc(f)}</span><span class="cnt">${n}</span>
                <span class="ed" data-fm="${i}" data-act="rename">이름</span>
                <span class="ed" data-fm="${i}" data-act="merge">합치기</span>

              </div>`;
        });
      });
      h+=`</div>`;
    });
    if(todo) h+=`<button class="btn w" id="goSort" style="margin-top:12px">정리 필요한 링크 ${todo}개 보기</button>`;
    body.innerHTML=h;
    const gs=document.getElementById('goSort');
    if(gs) gs.onclick=()=>{ q=''; tagF=''; go('all');
      const el=document.getElementById('q'); if(el){ el.value='분류전'; q='분류전'; renderAllTab(); } };
    return;
  }

  if(cleanView==='auto'){
    const target = _autoAll ? S.links : S.links.filter(needsSort);
    const props=[];
    target.forEach(function(l){
      const sg=suggest(l);
      if(sg && !(sg.group===l.group && sg.mid===l.mid && sg.folder===l.folder)) props.push({l:l,s:sg});
    });
    const byF={};
    props.forEach(function(p){ (byF[p.s.group+'§'+p.s.mid+'§'+p.s.folder]=byF[p.s.group+'§'+p.s.mid+'§'+p.s.folder]||[]).push(p); });
    const keys=Object.keys(byF).sort(function(a,b){ return byF[b].length-byF[a].length; });
    _autoIdx=byF;
    body.innerHTML=`<div class="sec"><h2>자동 분류</h2><span>${props.length}개 제안</span></div>
      <div class="seg" style="margin-top:6px">
        <b class="${_autoAll?'':'on'}" data-au="todo">정리 필요한 것만</b>

      + (keys.length ? keys.map(function(k){
          const arr=byF[k], p=k.split('§');
          return `<div class="tree" style="margin-top:10px">

          </div>`;
        }).join('')
        : `<div class="empty">제안할 게 없습니다.<br>제목·주소만으로는 더 정할 수 있는 게 없어요.</div>`)
      + (keys.length>1?`<button class="btn fill w" id="autoAllBtn" style="margin-top:12px">전부 적용 (${props.length}개)</button>`:'');
    const ab=document.getElementById('autoAllBtn');
    if(ab) ab.onclick=function(){
      if(!confirm(props.length+'개를 제안대로 옮깁니다. 계속할까요?'))return;
      props.forEach(function(p){ p.l.group=p.s.group; p.l.mid=p.s.mid; p.l.folder=p.s.folder;
        p.s.tags.forEach(function(t){ if(p.l.tags.indexOf(t)<0) p.l.tags.push(t); }); });
      save(); renderAllUI(); toast(props.length+'개 정리했습니다');
    };
    return;
  }

  if(cleanView==='import'){
    body.innerHTML=`
      <div class="sec"><h2>다른 곳에서 가져오기</h2><span>IMPORT</span></div>
      <div class="seg" id="impMode" style="margin-top:10px">
        <b class="${_importMode==='merge'?'on':''}" data-im="merge">합치기</b>
        <b class="${_importMode==='replace'?'on':''}" data-im="replace">지우고 이 파일로</b>
      </div>
      <div class="dropzone" id="dz">파일을 여기에 끌어다 놓거나 눌러서 고르기<br>
        <span style="font-size:10px">LINK.LOG 백업 JSON · 사파리/크롬 즐겨찾기 HTML · 노션 CSV</span></div>
      <div class="note" style="margin-top:8px">
        <b>${_importMode==='replace'?'지우고 이 파일로':'합치기'}</b> —
        ${_importMode==='replace'
          ? '지금 것을 비우고 파일 내용으로 바꿉니다. 다만 <b>직접 추가한 링크·메모를 쓴 링크·열어본 링크는 지우지 않고 남깁니다.</b> 옛 버전에서 잘못 들어간 데이터를 한 번에 정리할 때 쓰세요.'
          : '지금 것은 그대로 두고 파일에 있는 새 링크만 더합니다. 같은 주소는 합쳐집니다.'}
      </div>
      <div class="note">
        <b>노션 브랜드 표</b><br>노션 페이지 → 우측 상단 ··· → 내보내기 → 형식 CSV.
        속성 · 국가 · 금액대 · description 컬럼을 알아서 찾아 넣습니다.<br><br>
        <b>같은 주소는 합쳐집니다</b><br>이미 있는 주소면 새로 만들지 않고 정보만 채웁니다.
        크롬에도 있고 노션에도 있던 브랜드가 한 줄로 합쳐집니다.
      </div>`;
    document.getElementById('impMode').onclick=e=>{
      const b=e.target.closest('b'); if(!b)return; _importMode=b.dataset.im; renderClean();
    };
    const dz=document.getElementById('dz');
    dz.onclick=()=>document.getElementById('filePick').click();
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')};
    dz.ondragleave=()=>dz.classList.remove('drag');
    dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove('drag');
      if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
    return;
  }

  if(cleanView==='dup'){

    body.innerHTML=`<div class="sec"><span>${g.length}묶음 · 총 ${g.reduce((n,x)=>n+x.length,0)}개</span></div>`+
      g.map(grp=>`<div class="wake">
        <div class="wh"><b class="ell">${esc(normUrl(grp[0].url))}</b>
          <button class="btn sm" data-merge="${grp.map(x=>x.id).join(',')}">하나로 합치기</button></div>
        ${grp.map(rowHtml).join('')}
      </div>`).join('');

  }

  if(cleanView==='dead'){
    const arr=S.links.filter(l=>l.dead);
    body.innerHTML=`<div class="sec"><h2>안 열리는 링크</h2><span>DEAD</span></div>`+
      listHtml(arr,'표시된 죽은 링크가 없습니다.')+
      `<div class="note"><b>죽은 링크는 자동으로 지우지 않습니다</b><br>
        브라우저 보안(CORS) 때문에 앱 안에서 전체 검사를 돌릴 수 없습니다.
        검사는 따로 돌려서 결과를 표시해 드립니다. 지울지는 직접 정하세요.</div>`;
    return;
  }

  const todo=S.links.filter(l=>isTodo(l.folder)).length;
  body.innerHTML=`
    <div class="sec"><h2>계정 · 백업</h2><span>DATA</span></div>
    <div class="kv"><div class="l">동기화</div><div class="v" id="syncState">확인 중…</div></div>
    <button class="btn w" id="authBtn" style="margin-bottom:8px">로그인 / 로그아웃</button>
    <button class="btn w" id="expBtn" style="margin-bottom:8px">백업 내려받기 (JSON)</button>
    <div class="kv"><div class="l">현황</div><div class="v">전체 ${S.links.length}개 · 폴더 ${foldersOf('').length}개 · 분류 필요 ${todo}개 · 중복 ${dupGroups().length}묶음</div></div>
    <div class="kv"><div class="l">앱 버전</div><div class="v">${APP_VER}
${S.links.length&&S.links.every(l=>l.folder==='기타'||l.folder==='미분류')?'\n※ 전부 미분류입니다 — 옛 버전에서 넣은 데이터일 수 있습니다. 아래 「전부 지우고 처음부터」 후 다시 불러오세요.':''}</div></div>

/* ===================== 상세 / 편집 ===================== */
function openSheet(title,html){
  document.getElementById('shTitle').textContent=title;
  document.getElementById('shBody').innerHTML=html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('mask').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('mask').classList.remove('on');
  flushPendingCloud();
}
function openLink(id){
  const l=S.links.find(x=>x.id===id); if(!l)return;
  l.opens=(l.opens||0)+1; l.opened=Date.now(); save(); renderAllUI();
}
function folderPicker(cur){
  const all=[];
  GROUPS.forEach(g=>midsOf(g).forEach(m=>seedFoldersOf(g,m).forEach(f=>{ if(!all.includes(f))all.push(f); })));
  foldersOf('').forEach(p=>{ if(!all.includes(p[0]))all.push(p[0]); });
  return all.map(f=>`<b class="${cur===f?'on':''}" data-v="${esc(f)}">${esc(f)}</b>`).join('');
}
function openDetail(id){
  const l=S.links.find(x=>x.id===id); if(!l)return;
  openSheet(l.title||domainOf(l.url),`
    <div class="f"><label>제목</label><input id="e_title" value="${esc(l.title)}"></div>
    <div class="f"><label>주소</label><input id="e_url" value="${esc(l.url)}"></div>
    <div class="f"><label>대분류</label><div class="pick" id="e_group">
      ${GROUPS.map(g=>`<b class="${l.group===g?'on':''}" data-v="${esc(g)}">${esc(g)}</b>`).join('')}</div></div>
    <div class="f"><label>폴더</label><div class="pick" id="e_folder">${folderPicker(l.folder)}</div></div>
    <div class="f"><label>새 폴더 만들기</label><input id="e_newfolder" placeholder="비워두면 위에서 고른 폴더"></div>
    <div class="f2">
      <div class="f"><label>속성</label><input id="e_bcat" value="${esc(l.bcat)}"></div>
      <div class="f"><label>국가</label><input id="e_bcountry" value="${esc(l.bcountry)}"></div>
    </div>
    <div class="f"><label>금액대</label><input id="e_bprice" value="${esc(l.bprice)}"></div>
    <div class="f"><label>메모</label><textarea id="e_note">${esc(l.note)}</textarea></div>
    <div class="kv"><div class="l">기록</div><div class="v">저장 ${daysAgo(l.added)}일 전 · 연 횟수 ${l.opens||0}번${l.opened?' · 마지막 '+daysAgo(l.opened)+'일 전':''}
      ${(l.srcs||[]).length?'\n출처 '+l.srcs.join(', '):''}</div></div>
    <div class="f2" style="margin-top:14px">
      <button class="btn fill" id="e_save">저장</button>
      <a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener" id="e_open">열기</a>
    </div>
    <div class="f2" style="margin-top:8px">
      <button class="btn" id="e_dead">${l.dead?'살아있음으로 표시':'안 열림으로 표시'}</button>
      <button class="btn danger" id="e_del">삭제</button>
    </div>`);
  const one=(sel)=>{ document.getElementById(sel).onclick=e=>{ const b=e.target.closest('b'); if(!b)return;
    document.querySelectorAll('#'+sel+' b').forEach(x=>x.classList.toggle('on',x===b)); }; };
  one('e_group'); one('e_folder');
  document.getElementById('e_open').onclick=()=>{ openLink(id); };
  document.getElementById('e_save').onclick=()=>{
    l.title=document.getElementById('e_title').value.trim();
    l.url=document.getElementById('e_url').value.trim();
    const g=document.querySelector('#e_group b.on'), f=document.querySelector('#e_folder b.on');
    const nf=document.getElementById('e_newfolder').value.trim();
    l.group=g?g.dataset.v:l.group;
    l.folder=nf||(f?f.dataset.v:l.folder);
    l.note=document.getElementById('e_note').value;
    l.bcat=document.getElementById('e_bcat').value.trim();
    l.bcountry=document.getElementById('e_bcountry').value.trim();
    l.bprice=document.getElementById('e_bprice').value.trim();
    save(); renderAllUI(); closeSheet(); toast('저장했습니다');
  };
  document.getElementById('e_dead').onclick=()=>{ l.dead=!l.dead; save(); renderAllUI(); closeSheet(); };
  document.getElementById('e_del').onclick=()=>{
    if(!confirm('이 링크를 지울까요?'))return;
    S.links=S.links.filter(x=>x.id!==id); save(); renderAllUI(); closeSheet(); toast('지웠습니다');
  };
}

function isKor(u){ return /(\.kr|cafe24\.com|naver\.com)(\/|$)/i.test(u||''); }
const BLOGHOST=['blog.naver','cafe.naver','brunch.co','tistory','blogspot','velog'];
function suggest(l){
  const txt=[l.title,l.url,l.note,l.bcat,l.bcountry].join(' ').toLowerCase();
  let best=null,bs=0;
  AUTORULES.forEach(function(r){
    const hit=r[2].filter(function(k){ return txt.indexOf(k)>=0; }).length;
    if(hit){ const sc=r[1]*10+hit; if(sc>bs){ best=r[0]; bs=sc; } }
  });
  /* 네이버 카페·블로그 주소는 예비 규칙 — 내용 키워드가 하나도 안 걸렸을 때만 쓴다.
     안 그러면 '중국의류공장 … : 네이버 카페' 같은 글이 공장에서 블로그로 끌려간다. */
  if(!best && BLOGHOST.some(function(h){ return txt.indexOf(h)>=0; })) best='블로그·일상';
  if(!best) return null;
  let g,m;
  if(best==='편집샵'||best==='플랫폼·몰'||best==='스마트스토어'||best==='직구몰'){
    g='04_쇼핑처'; m=isKor(l.url)?'01_국내':'02_해외';
    if(best==='플랫폼·몰'&&m==='02_해외') best='직구몰';
    if(best==='스마트스토어') m='01_국내';
  } else { const p=placeOf(best); g=p[0]; m=p[1]; }
  const tags=AUTOTAGS.filter(function(t){ return t[1].some(function(k){ return txt.indexOf(k)>=0; }); }).map(function(t){ return t[0]; });
  return {group:g, mid:m, folder:best, tags:tags, score:bs};
}

function parseUrls(s){
  return String(s||'').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean)
    .map(u=>/^https?:\/\//i.test(u)?u:'https://'+u)
    .filter(u=>/^https?:\/\/[^\s./]+\.[^\s/]+/i.test(u));
}
function quickPreview(id){
  const inp=document.getElementById(id+'_in'), res=document.getElementById(id+'_res');
  if(!inp||!res) return;
  const us=parseUrls(inp.value);
  if(!us.length){ res.style.display='none'; return; }
  res.style.display='block';
  if(us.length===1){
    const dupe=S.links.find(l=>normUrl(l.url)===normUrl(us[0]));
    res.innerHTML = dupe ? `이미 있는 주소입니다 — <b>${esc(dupe.folder)}</b>`
      : `<b>${esc(autoFolder(us[0],''))}</b> 폴더로 들어갑니다`;
  } else {
    const nw=us.filter(u=>!S.links.some(l=>normUrl(l.url)===normUrl(u))).length;
    res.innerHTML=`주소 <b>${us.length}개</b> — 새로 <b>${nw}개</b>, 이미 있는 것 ${us.length-nw}개`;
  }
}
function quickAdd(id){
  const inp=document.getElementById(id+'_in');

  us.forEach(url=>{
    if(S.links.some(l=>normUrl(l.url)===normUrl(url))){ dup++; return; }
    const f=autoFolder(url,'');
    S.links.push(normLink({url,title:domainOf(url),folder:f,group:groupOf(f)||'미분류',
      added:Date.now(),srcs:['직접']}));
    add++; last=f;
  });

  const el=document.getElementById(id+'_in'); if(el){ el.value=''; el.focus(); }
  const res=document.getElementById(id+'_res'); if(res) res.style.display='none';
  toast(add?(add===1?last+'에 추가했습니다':add+'개 추가했습니다'+(dup?' ('+dup+'개는 이미 있음)':''))
           :'전부 이미 있는 주소입니다');
}
function bindQuick(id){
  const inp=document.getElementById(id+'_in'); if(!inp) return;

}

let _importMode='merge';
function readFile(file){
  const r=new FileReader();
  r.onload=()=>{
    const txt=String(r.result), n=file.name.toLowerCase();
    try{
      if(n.endsWith('.csv')) importNotionCsv(txt);
      else if(n.endsWith('.json')) importJson(txt,_importMode);
      else importNetscape(txt, /safari|사파리/i.test(n)?'사파리':'크롬');
    }catch(e){ console.error(e); toast('파일을 읽지 못했습니다'); }
  };
  r.readAsText(file);
}
/* 폴더 없는 링크 자동 판별 */
const TOOLD=['docs.google','drive.google','mail.google','calendar.google','google.co','google.com','figma.com',
 'firebase','chatgpt','claude.ai','gemini.google','genspark','notion.so','github.io','vercel.app',
 'localhost','hometax.go.kr','kiwi.today','youtube.com'];
const PLATD=['musinsa','zalando','29cm','29cco','ssfshop','hbx','farfetch','net-a-porter','mrporter',
 'smallable','ohou.se','coupang','wconcept','lfmall','sivillage','kream','ssense','shopbop','mytheresa',
 'revolve','urbanoutfitters','tres-bien','goodhoodstore','gr8.jp'];
function autoFolder(url,title){
  const d=domainOf(url).toLowerCase(), t=String(title||'').toLowerCase();
  const has=(...ks)=>ks.some(k=>t.indexOf(k)>=0);
  /* 제목 키워드가 도메인보다 정확한 경우 — 안 그러면 '동대문종합시장'이 브랜드·해외로 간다 */
  if(has('동대문','도매','시장','부자재','단추','지퍼','원단','자재')||d.indexOf('ddm-mall')>=0) return '도매 사이트';
  if(has('퀵','택배','배송','운송')||d.indexOf('kakao')>=0) return '일 도구';
  if(has('국세청','홈택스','세금','은행','카드')) return '일 도구';
  if(has('매거진','magazine','프레스','press','뉴스','칼럼')||d.indexOf('fashion-press')>=0) return '매거진';
  if(has('공장','봉제','사가','시야게','나염','자수')) return '공장';
  if(has('폰트','font')) return '폰트사이트';
  if(has('무료','저작권','이미지','소스','목업','mockup','아이콘')) return '무료소스';
  if(d.indexOf('smartstore.naver.com')>=0) return '스마트스토어';
  if(TOOLD.some(k=>d.indexOf(k)>=0)||d==='naver.com') return '일 도구';
  if(d.indexOf('blog.naver')>=0||d.indexOf('cafe.naver')>=0||d.indexOf('brunch')>=0) return '블로그·글(분류전)';
  if(d.indexOf('pinterest')>=0) return '이미지사이트';
  if(PLATD.some(k=>d.indexOf(k)>=0)) return '편집샵·플랫폼';
  return /(\.kr|cafe24\.com|naver\.com)$/.test(d)?'브랜드·국내(분류전)':'브랜드·해외(분류전)';
}
function importNetscape(html,src){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const as=[...doc.querySelectorAll('a[href]')];
  if(!as.length){ toast('즐겨찾기를 찾지 못했습니다'); return; }
  let add=0, merge=0;
  as.forEach(a=>{
    const url=a.getAttribute('href')||'';
    if(!/^https?:/i.test(url)) return;
    const title=(a.textContent||'').trim()||domainOf(url);
    let folder=''; const p=a.closest('dl');
    if(p&&p.previousElementSibling) folder=(p.previousElementSibling.textContent||'').trim();
    folder=folder.replace(/^(즐겨찾기바|즐겨찾기|기타|모바일)$/,'');
    const ex=S.links.find(l=>normUrl(l.url)===normUrl(url));
    if(ex){ if(!ex.srcs.includes(src)){ ex.srcs.push(src); merge++; } }
    else{
      const f=folder||autoFolder(url,title);
      S.links.push(normLink({url,title,folder:f,group:groupOf(f)||'미분류',added:Date.now(),srcs:[src]}));
      add++;
    }
  });
  save(); renderAllUI();
  toast(src+' — 새로 '+add+'개, 이미 있던 것 '+merge+'개');
}
function parseCsv(text){
  const rows=[]; let row=[], cur='', qt=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(qt){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else qt=false; } else cur+=c; }
    else if(c==='"') qt=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function importNotionCsv(text){
  const rows=parseCsv(text);
  if(rows.length<2){ toast('CSV가 비어 있습니다'); return; }
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const find=(...names)=>{ for(const n of names){ const i=head.findIndex(h=>h.includes(n)); if(i>=0)return i; } return -1; };
  const iUrl=find('url','링크','주소','website');
  const iName=find('브랜드','name','이름','제목','title');
  const iCat=find('속성','category','분류','종류');
  const iCountry=find('국가','country','지역');
  const iPrice=find('금액','price','가격');
  const iDesc=find('description','설명','메모','note');
  if(iUrl<0){ toast('CSV에 url 컬럼을 찾지 못했습니다'); return; }
  let add=0, merge=0;
  rows.slice(1).forEach(r=>{
    const url=(r[iUrl]||'').trim();
    if(!/^https?:/i.test(url)) return;
    const g=(i)=>i>=0?(r[i]||'').trim():'';
    const name=g(iName), cat=g(iCat), country=g(iCountry), price=g(iPrice), desc=g(iDesc);
    const ex=S.links.find(l=>normUrl(l.url)===normUrl(url));
    if(ex){
      /* 중복: 새로 만들지 않고 브랜드 정보만 채운다 (크롬↔노션 중복 해소 지점) */
      if(name&&!ex.title) ex.title=name;
      ex.bcat=ex.bcat||cat; ex.bcountry=ex.bcountry||country; ex.bprice=ex.bprice||price;
      if(desc&&!ex.note) ex.note=desc;
      if(!ex.srcs.includes('노션')) ex.srcs.push('노션');
      merge++;
    }else{
      const f=autoFolder(url,name);
      S.links.push(normLink({url,title:name||domainOf(url),folder:f,group:groupOf(f)||'옷·브랜드',
        note:desc,bcat:cat,bcountry:country,bprice:price,added:Date.now(),srcs:['노션']}));
      add++;
    }
  });
  save(); renderAllUI(); go('brand');
  toast('노션 — 새로 '+add+'개, 기존과 합침 '+merge+'개');
}
/* 내가 손댄 링크인가 — 덮어쓰기에서 지우면 안 되는 것 */
function isMine(l){
  return (l.srcs||[]).includes('직접') || (l.opens||0)>0 || !!l.note || l.dead;
}
function importJson(text, mode){
  const d=JSON.parse(text);
  if(!d||!Array.isArray(d.links)){ toast('LINK.LOG 백업 파일이 아닙니다'); return; }
  const incoming=d.links.map(normLink);
  const inSet={}; incoming.forEach(x=>{ inSet[normUrl(x.url)]=1; });

  if(mode==='replace'){
    /* 파일에 없는 것 중 "내가 손댄 것"은 지우지 않고 남긴다.
       직접 추가한 링크가 덮어쓰기로 사라지는 게 제일 뼈아프기 때문. */
    const keep=S.links.filter(l=>!inSet[normUrl(l.url)]&&isMine(l));
    const byUrl={}; S.links.forEach(l=>{ byUrl[normUrl(l.url)]=l; });
    S.links=incoming.map(x=>{
      const old=byUrl[normUrl(x.url)];
      if(!old) return x;
      /* 열어본 횟수·메모·죽은표시는 내 기록이니 살린다 */
      x.opens=Math.max(x.opens||0,old.opens||0);
      x.opened=Math.max(x.opened||0,old.opened||0);
      x.note=x.note||old.note; x.dead=x.dead||old.dead;
      (old.srcs||[]).forEach(s=>{ if(!x.srcs.includes(s))x.srcs.push(s); });
      return x;
    }).concat(keep);
    save(); renderAllUI(); go('home');
    toast('파일로 바꿨습니다 — '+incoming.length+'개'+(keep.length?' (내가 추가한 '+keep.length+'개는 유지)':''));
    return;
  }

  let add=0, merge=0;
  incoming.forEach(x=>{
    const ex=S.links.find(l=>normUrl(l.url)===normUrl(x.url));
    if(ex){ (x.srcs||[]).forEach(s=>{ if(!ex.srcs.includes(s))ex.srcs.push(s); }); merge++; }
    else { S.links.push(x); add++; }
  });
  save(); renderAllUI(); go('home');
  toast('새로 '+add+'개, 이미 있던 것 '+merge+'개');
}
function exportJson(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='linklog-backup.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

const FB_CONFIG={apiKey:"AIzaSyCx84fnTSZl9_eTMaUkts0VCyIx4qrql2I",authDomain:"fpf-manager.firebaseapp.com",projectId:"fpf-manager",storageBucket:"fpf-manager.firebasestorage.app",messagingSenderId:"415966666310",appId:"1:415966666310:web:9c4bb75cd2594cc744b447"};
let fbUser=null,fbAuth=null,fbDB=null,_rtUnsub=null,_pushT=null,_pushedTs='',_pendingCloud=null;

function initFb(att){
  att=att||0;
  if(typeof firebase==='undefined'){ if(att<40)setTimeout(()=>initFb(att+1),150); else console.warn('Firebase SDK 로드 실패'); return; }
  try{

function setAcct(){
  const pc=document.getElementById('acctPc'), mo=document.getElementById('acctMo');
  pc.textContent=fbUser?((fbUser.email||'').split('@')[0]||'계정')+' · 동기화':'로그인하고 동기화';

}
function cloudRef(){ return fbDB.collection('users').doc(fbUser.uid).collection('data').doc('linklog'); }
function cloudPayload(){ return JSON.stringify({v:2,links:S.links}); }
function cloudPush(){
  if(!fbUser||!fbDB)return;
  clearTimeout(_pushT);
  _pushT=setTimeout(function(){
    const ts=Date.now()+'_'+Math.floor(Math.random()*100000); _pushedTs=ts;
    cloudRef().set({value:cloudPayload(),ts:ts,at:new Date().toISOString()})
      .catch(function(e){ console.error('push',e); if(e.code==='permission-denied')toast('동기화 권한 오류 — 규칙 확인 필요'); });
  },700);
}
function startCloudSync(){
  if(!fbUser||!fbDB)return;
  if(_rtUnsub){try{_rtUnsub()}catch(e){} _rtUnsub=null;}
  let first=true;
  _rtUnsub=cloudRef().onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.exists){ cloudPush(); first=false; return; }
    const d=snap.data(); if(!d||!d.value)return;
    if(d.ts&&d.ts===_pushedTs)return;
    let data; try{ data=JSON.parse(d.value); }catch(e){ return; }
    if(!data||!Array.isArray(data.links))return;
    if(isBusy()){ _pendingCloud=data; return; }
    applyCloud(data,!first); first=false;
  },function(e){ console.error('snap',e); if(e.code==='permission-denied')toast('동기화 권한 오류 — 규칙 확인 필요'); });
}
function stopCloudSync(){ if(_rtUnsub){try{_rtUnsub()}catch(e){} _rtUnsub=null;} }
function isBusy(){
  if(document.querySelector('.sheet.on'))return true;
  const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function flushPendingCloud(){ if(_pendingCloud&&!isBusy()){ const d=_pendingCloud; _pendingCloud=null; applyCloud(d,true); } }
function applyCloud(data,notify){
  S.links=(data.links||[]).map(normLink);
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  renderAllUI();
  if(notify)toast('다른 기기 변경이 반영됐어요');
}

  };

      keep.opens=(keep.opens||0)+(x.opens||0);

let _fmIdx=[], _autoIdx={}, _autoAll=false;
function folderCount(g,m,f){ return S.links.filter(l=>l.group===g&&l.mid===m&&l.folder===f).length; }
function applyFolder(g,m,f,ng,nm,nf){
  let n=0;
  S.links.forEach(l=>{ if(l.group===g&&l.mid===m&&l.folder===f){ l.group=ng; l.mid=nm; l.folder=nf; n++; } });
  save(); renderAllUI(); toast(n+'개를 '+nf+'(으)로 옮겼습니다');
}
function openFolderManage(i,act){
  const t=_fmIdx[i]; if(!t) return;
  const n=folderCount(t.g,t.m,t.f);
  if(act==='rename'){
    const nv=prompt('폴더 이름 바꾸기 ('+n+'개)\n\n'+t.f+' →', t.f);
    if(nv===null) return;
    const v=nv.trim(); if(!v||v===t.f) return;
    applyFolder(t.g,t.m,t.f, t.g,t.m,v);
    return;
  }
  /* 합치기·옮기기 — 목적지를 목록에서 고른다 */
  const dest=[];
  GROUPS.forEach(g=>midsOf(g).forEach(m=>seedFoldersOf(g,m).forEach(f=>{
    if(g===t.g&&m===t.m&&f===t.f) return;
    dest.push([g+' › '+m+' › '+f, folderCount(g,m,f), g,m,f]);
  })));
  S.links.forEach(l=>{
    if(l.group===t.g&&l.mid===t.m&&l.folder===t.f) return;
    if(!dest.some(d=>d[2]===l.group&&d[3]===l.mid&&d[4]===l.folder))
      dest.push([l.group+' › '+l.mid+' › '+l.folder, folderCount(l.group,l.mid,l.folder), l.group,l.mid,l.folder]);
  });
  openFolderPick((act==='merge'?'어느 폴더에 합칠까요':'어디로 옮길까요')+' — '+t.f+' '+n+'개',
    dest.map(d=>[d[0],d[1]]),
    (label)=>{ const d=dest.find(x=>x[0]===label); if(d) applyFolder(t.g,t.m,t.f, d[2],d[3],d[4]); });
}
